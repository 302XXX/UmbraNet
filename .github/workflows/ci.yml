name: CI

# Проверка кода и тестов на двух системах, где программа реально живёт:
# Windows (там она работает с WinDivert, DNS и UAC) и Linux (там её удобно
# гонять в песочнице, и там ловятся вещи, которые на Windows незаметны:
# регистр имён файлов, пути, кодировка вывода).
#
# Запускается на каждый push и на pull request — чтобы поломка находилась
# автоматически, а не по факту прогона пользователем.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Новый push в ту же ветку отменяет предыдущий прогон: не копим очереди.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # падение на Windows не должно скрывать результат Linux
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # PySide6 в offscreen-режиме тянет системные библиотеки. В ubuntu-latest
      # их нет «из коробки» — без этого шага тесты интерфейса падают на импорте.
      - name: Системные библиотеки для Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: Проверка кода (критические правила)
        # Не весь набор правил ruff: в проекте уже есть «долги» (глухие
        # except: Exception, try/except/pass и т. п.), их разбор — отдельная
        # задача. Здесь то, что действительно ломает программу в бою:
        #   E9  — ошибки синтаксиса/импорта
        #   F63 — бессмысленное сравнение (обычно опечатка)
        #   F7  — ошибки в синтаксисе выражений (break/continue/return вне цикла)
        #   F82 — неопределённое имя (NameError в рантайме)
        #   F811 — повторное определение функции/импорта
        run: ruff check --select E9,F63,F7,F82,F811 --output-format=github .

      - name: Тесты
        # offscreen: у виртуальных машин GitHub нет дисплея, а тесты интерфейса
        # поднимают настоящее окно Qt.
        #
        # Выход pytest пишем в файл и продублируем в лог: если процесс умер
        # не «красиво» (сегфолт — exit 139), файл сохранит то, что успело
        # напечататься, а хвост улетит в сводку шага (вкладка Summary) —
        # падение читается без ползания по логам.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
        run: |
          # RUNNER запускает bash с -e (errexit), поэтому «python ... || code=$?»
          # — иначе при любом ненулевом коде сценарий умрёт до записи отчёта.
          python -m pytest tests -q -rf --tb=short > pytest_output.txt 2>&1 || code=$?
          code=${code:-0}
          cat pytest_output.txt
          if [ "$code" -ne 0 ]; then
            # Хвост лога в сводку шага (вкладка Summary).
            {
              echo "## ❌ Тесты упали (код $code)"
              echo ""
              echo '```'
              tail -n 150 pytest_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Плюс аннотации в Checks: без логов видно, какие тесты упали
            # и последние строки перед падением.
            grep -E "^(FAILED|ERROR)" pytest_output.txt | head -n 10 | while IFS= read -r line; do
              echo "::error file=tests::${line}"
            done
            tail -n 20 pytest_output.txt | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml::${line}"
            done
          fi
          exit "$code"

      - name: Диагностика при падении
        if: failure()
        shell: bash
        run: |
          echo "--- версия Python ---"
          python --version
          echo "--- установленные пакеты ---"
          python -m pip list
          echo "--- найденные файлы состояния ---"
          python -c "import glob; print(glob.glob('umbranet_ui.json') + glob.glob('*.log'))"
          # Хвост лога тестов в сводку шага — чтобы падение читалось на вкладке Summary.
          if [ -f pytest_output.txt ]; then
            {
              echo ""
              echo "## Хвост лога тестов"
              echo '```'
              tail -n 200 pytest_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
